<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Dragon Turn Battle v4</title>
<style>
:root{--red:#ff5b66;--red2:#ffb4aa;--blue:#5bbcff;--cyan:#9eeeff;--gold:#ffd36b;--glass:rgba(4,8,14,.76)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02050a;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;user-select:none;touch-action:manipulation}button{font:inherit;color:inherit}
#game{position:relative;width:100%;height:100%;overflow:hidden;background:#10151e center/cover no-repeat;transition:background-image .45s}.vignette{position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(circle at 50% 46%,transparent 20%,rgba(0,0,0,.18) 62%,rgba(0,0,0,.72) 100%)}
.siren{position:absolute;z-index:3;top:0;width:95px;height:100%;pointer-events:none;opacity:.8;mix-blend-mode:screen}.siren.left{left:0;background:linear-gradient(90deg,rgba(255,20,35,.45),transparent)}.siren.right{right:0;background:linear-gradient(270deg,rgba(255,20,35,.45),transparent)}.siren:after{content:"";position:absolute;top:10%;bottom:10%;width:18px;border-radius:50%;background:#ff1d2c;filter:blur(10px);box-shadow:0 0 36px 12px #ff2337;animation:siren 1.05s infinite steps(1)}.left:after{left:20px}.right:after{right:20px}@keyframes siren{0%,45%{opacity:.12}46%,70%{opacity:.9}71%,100%{opacity:.22}}
.smoke{position:absolute;z-index:2;width:38vw;height:24vw;max-width:560px;max-height:350px;border-radius:50%;filter:blur(30px);background:radial-gradient(ellipse,rgba(190,200,215,.14),rgba(70,80,90,.08) 45%,transparent 70%);animation:smoke 8s ease-in-out infinite alternate;pointer-events:none}.s1{left:8%;bottom:8%}.s2{right:2%;top:18%;animation-delay:-3.5s}@keyframes smoke{to{transform:translate(45px,-25px) scale(1.15);opacity:.55}}
#sparkLayer{position:absolute;inset:0;z-index:4;pointer-events:none;overflow:hidden}.spark{position:absolute;width:3px;height:18px;background:#ffdca0;box-shadow:0 0 10px #ff6b2f;transform:rotate(35deg);animation:spark .7s linear forwards}@keyframes spark{to{transform:translate(60px,100px) rotate(35deg);opacity:0}}
.enemyRow{position:absolute;z-index:5;left:50%;top:46%;transform:translate(-50%,-50%);width:min(920px,70vw);height:min(540px,62vh);display:flex;align-items:flex-end;justify-content:center;gap:clamp(18px,4vw,64px)}.enemy{position:relative;height:82%;width:27%;display:flex;align-items:flex-end;justify-content:center;filter:drop-shadow(0 16px 18px rgba(0,0,0,.75));animation:float 2.3s ease-in-out infinite alternate}.enemy:nth-child(2){height:96%;animation-delay:-.8s}.enemy:nth-child(3){animation-delay:-1.4s}.enemy img{max-height:100%;max-width:100%;object-fit:contain;transform-origin:50% 72%}.enemy .hp{position:absolute;bottom:-22px;width:76%;height:5px;border:1px solid rgba(255,255,255,.35);background:#121218;border-radius:10px;overflow:hidden}.enemy .hp i{display:block;height:100%;background:linear-gradient(90deg,#d9365e,#ff8b6f);width:100%;transition:width .25s}.enemy.hit img{animation:hit .28s}.enemy.attack img{animation:eAtk .48s}.enemy.dead{filter:grayscale(.5);animation:dead .6s forwards}@keyframes float{to{transform:translateY(-12px)}}@keyframes hit{25%{transform:translateX(-12px) rotate(-2deg);filter:brightness(2)}55%{transform:translateX(8px)}100%{transform:none}}@keyframes eAtk{45%{transform:translateY(-18px) scale(1.08)}100%{transform:none}}@keyframes dead{to{opacity:0;transform:translateY(45px) scale(.8)}}
.topbar{position:absolute;z-index:8;top:12px;left:50%;transform:translateX(-50%);width:min(520px,58vw);text-align:center;text-shadow:0 2px 5px #000}.title{font-size:12px;letter-spacing:.16em;opacity:.75}.chain{margin-top:5px;height:10px;border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.55);border-radius:20px;overflow:hidden;box-shadow:0 0 18px rgba(255,180,80,.12)}.chain i{display:block;width:0;height:100%;background:linear-gradient(90deg,#6edaff,#ffe36a,#ff875b);transition:width .25s}.chainReady{color:#fff1a7;text-shadow:0 0 10px #ffbe45;animation:pulse .55s infinite alternate}@keyframes pulse{to{opacity:.55;transform:scale(.97)}}
.turnOrb{position:absolute;z-index:10;bottom:18px;width:142px;height:142px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .25s,filter .25s}.turnOrb.left{left:18px}.turnOrb.right{right:18px}.turnOrb.ready{animation:readyPulse .65s infinite alternate;filter:brightness(1.25)}@keyframes readyPulse{to{transform:scale(1.065)}}.ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--c1) calc(var(--p)*1%),rgba(255,255,255,.06) 0);filter:drop-shadow(0 0 12px var(--glow));transform:rotate(-90deg)}.ring:after{content:"";position:absolute;inset:9px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.12),rgba(5,8,14,.9) 68%);border:1px solid rgba(255,255,255,.25)}.orn{position:absolute;inset:-8px;border-radius:50%;border:2px solid rgba(255,255,255,.15);box-shadow:0 0 18px var(--glow),inset 0 0 14px var(--glow)}.orbFace{position:relative;z-index:2;width:86px;height:86px;border-radius:50%;overflow:hidden;border:2px solid rgba(255,255,255,.5);background:#0a0c11;box-shadow:0 0 18px var(--glow)}.orbFace img{width:100%;height:130%;object-fit:cover;object-position:50% 10%}.symbol{position:absolute;z-index:3;bottom:-3px;font-size:24px;filter:drop-shadow(0 0 8px var(--glow))}.orbName{position:absolute;bottom:-24px;font-weight:800;font-size:12px;text-shadow:0 2px 5px #000}.dragonOrb{--c1:#ff6971;--glow:#ff4a54}.heroOrb{--c1:#60bfff;--glow:#3f9fff}.dragonOrb .orn{background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.11),transparent 28%),repeating-conic-gradient(from 0deg,rgba(255,255,255,.32) 0 2deg,transparent 2deg 30deg)}.heroOrb .orn{border-radius:32% 32% 50% 50%;transform:scale(.92);box-shadow:0 0 18px #399cff,inset 0 0 18px #1f6fd4}.heroOrb:after{content:"";position:absolute;z-index:-1;width:86px;height:80px;bottom:-8px;background:radial-gradient(ellipse at center bottom,#2d8dff 0,rgba(44,137,255,.52) 26%,transparent 70%);filter:blur(8px);animation:flame .5s infinite alternate}@keyframes flame{to{transform:scaleY(1.22) scaleX(.85);opacity:.55}}
.status{position:absolute;z-index:8;bottom:18px;left:50%;transform:translateX(-50%);font-size:11px;text-align:center;opacity:.75;text-shadow:0 2px 4px #000}.status b{color:#fff3a0}
.activeLayer{position:absolute;z-index:12;inset:0;pointer-events:none;display:none}.activeLayer.show{display:block}.activeChar{position:absolute;bottom:-2%;max-height:88vh;max-width:48vw;filter:drop-shadow(0 18px 24px rgba(0,0,0,.65));opacity:0}.activeChar.focusIn{animation:charFocus .38s cubic-bezier(.2,.8,.2,1) forwards}.activeChar.heroFocus{left:62%;transform:translateX(-50%)}.activeChar.dragonFocus{left:38%;transform:translateX(-50%)}@keyframes charFocus{0%{opacity:0;filter:blur(8px) brightness(1.35) drop-shadow(0 18px 24px rgba(0,0,0,.65));scale:.78}65%{opacity:1;filter:blur(0) brightness(1.1) drop-shadow(0 18px 24px rgba(0,0,0,.65));scale:1.04}100%{opacity:1;filter:blur(0) brightness(1) drop-shadow(0 18px 24px rgba(0,0,0,.65));scale:1}}
.cmdWrap{position:absolute;z-index:14;bottom:20%;pointer-events:auto;display:flex;gap:8px;align-items:center}.cmdWrap.left{left:37%}.cmdWrap.right{right:37%;flex-direction:row-reverse}.cmd{opacity:0;transform:translateX(var(--sx));min-width:118px;height:52px;border:1px solid rgba(255,255,255,.28);border-radius:8px;background:linear-gradient(180deg,rgba(22,33,49,.94),rgba(5,10,17,.94));box-shadow:0 9px 24px rgba(0,0,0,.4),0 0 10px rgba(90,180,255,.12);font-weight:850;letter-spacing:.08em;cursor:pointer;animation:cmdIn .28s forwards}.cmd:nth-child(2){animation-delay:.07s}.cmd:nth-child(3){animation-delay:.14s}.cmd:hover,.cmd:active{filter:brightness(1.3);transform:scale(.98)}@keyframes cmdIn{to{opacity:1;transform:translateX(0)}}.submenu{position:absolute;z-index:15;bottom:9%;left:50%;transform:translateX(-50%);display:flex;gap:8px;pointer-events:auto}.submenu button{min-width:150px;min-height:46px;border:1px solid rgba(255,255,255,.28);border-radius:9px;background:rgba(6,12,20,.94);box-shadow:0 0 14px rgba(100,190,255,.15);cursor:pointer;font-weight:750}.submenu button small{display:block;font-size:9px;opacity:.62;font-weight:500}.submenu .back{min-width:70px;opacity:.7}
.fx{position:absolute;z-index:20;inset:0;pointer-events:none;overflow:hidden}.slash{position:absolute;left:20%;top:40%;width:64%;height:16px;background:linear-gradient(90deg,transparent,#fff 30%,#69c9ff 45%,#fff 58%,transparent);box-shadow:0 0 25px #4db8ff;transform:rotate(-13deg) scaleX(0);animation:slash .45s ease-out forwards}@keyframes slash{45%{transform:rotate(-13deg) scaleX(1.1)}100%{opacity:0;transform:rotate(-13deg) scaleX(1.45)}}.redslash{filter:hue-rotate(130deg) saturate(1.7)}.ringFx{position:absolute;left:50%;top:44%;width:250px;height:250px;margin:-125px;border-radius:50%;border:5px solid #ff9d58;box-shadow:0 0 30px #ff5b36,inset 0 0 28px #ff5b36;animation:ringFx .7s forwards}@keyframes ringFx{from{transform:scale(.15) rotate(0);opacity:1}to{transform:scale(1.8) rotate(80deg);opacity:0}}.burst{position:absolute;left:50%;top:44%;width:40px;height:40px;margin:-20px;border-radius:50%;background:white;box-shadow:0 0 30px 18px #ff8c55,0 0 70px 36px rgba(255,65,30,.55);animation:burst .45s forwards}@keyframes burst{to{transform:scale(5);opacity:0}}.dmg{position:absolute;left:50%;top:31%;transform:translateX(-50%);font-size:clamp(28px,5vw,62px);font-weight:950;text-shadow:0 3px 4px #000,0 0 14px currentColor;animation:dmg .8s forwards}@keyframes dmg{to{transform:translate(-50%,-70px) scale(1.18);opacity:0}}.flash{position:absolute;inset:0;background:#fff;animation:flash .18s forwards}@keyframes flash{to{opacity:0}}.shake{animation:shake .32s}@keyframes shake{15%,45%,75%{transform:translate(6px,-2px)}30%,60%,90%{transform:translate(-7px,3px)}100%{transform:none}}
.attackActor{position:absolute;z-index:22;left:50%;bottom:-2%;max-height:92vh;max-width:72vw;filter:drop-shadow(0 18px 30px #000);animation:atkActor .78s ease-out forwards}@keyframes atkActor{0%{opacity:0;filter:blur(9px) drop-shadow(0 18px 30px #000);transform:translateX(-50%) scale(.72)}22%{opacity:1;filter:blur(0) drop-shadow(0 18px 30px #000);transform:translateX(-50%) scale(1.04)}72%{opacity:1;transform:translateX(-50%) scale(1)}100%{opacity:0;filter:blur(8px) drop-shadow(0 18px 30px #000);transform:translateX(-50%) scale(.82)}}.enemyCutin{position:absolute;z-index:24;left:50%;top:50%;max-height:78vh;max-width:54vw;filter:drop-shadow(0 18px 32px #000);animation:enemyCutin .72s ease-out forwards}@keyframes enemyCutin{0%{opacity:0;filter:blur(10px) brightness(1.5);transform:translate(-50%,-50%) scale(.55)}25%{opacity:1;filter:blur(0) brightness(1.2);transform:translate(-50%,-50%) scale(1.12)}72%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;filter:blur(7px);transform:translate(-50%,-50%) scale(.8)}}
@media(max-width:760px){.enemyRow{width:76vw;height:54vh;top:43%;gap:10px}.turnOrb{width:105px;height:105px;bottom:12px}.orbFace{width:62px;height:62px}.turnOrb.left{left:8px}.turnOrb.right{right:8px}.cmdWrap.left{left:32%}.cmdWrap.right{right:32%}.cmd{min-width:83px;height:43px;font-size:11px}.activeChar{max-height:76vh;max-width:53vw}.submenu{bottom:11%;gap:4px}.submenu button{min-width:96px;min-height:40px;font-size:10px;padding:5px}.status{font-size:9px}.siren{width:60px}}
</style></head><body><div id="game">
<div class="vignette"></div><div class="siren left"></div><div class="siren right"></div><div class="smoke s1"></div><div class="smoke s2"></div><div id="sparkLayer"></div>
<div class="topbar"><div class="title" id="stageTitle">ALIEN SHIP · CORRIDOR</div><div id="chainText">연계 게이지 0%</div><div class="chain"><i id="chainFill"></i></div></div>
<div class="enemyRow" id="enemyRow"></div>
<div class="turnOrb left dragonOrb" id="dragonOrb"><div class="ring"></div><div class="orn"></div><div class="orbFace"><img src="assets/dragon_human.png"></div><div class="symbol">✦</div><div class="orbName">실리트라</div></div>
<div class="turnOrb right heroOrb" id="heroOrb"><div class="ring"></div><div class="orn"></div><div class="orbFace"><img src="assets/hero.png"></div><div class="symbol">⚔</div><div class="orbName">카엘</div></div>
<div class="status" id="status">게이지가 가득 차면 캐릭터를 누르세요.</div>
<div class="activeLayer" id="activeLayer"><img id="activeChar" class="activeChar"><div id="cmdWrap" class="cmdWrap"></div><div id="submenu" class="submenu"></div></div>
<div class="fx" id="fx"></div></div>
<script>
(()=>{'use strict';const A='assets/';const game=document.getElementById('game'),enemyRow=document.getElementById('enemyRow'),heroOrb=document.getElementById('heroOrb'),dragonOrb=document.getElementById('dragonOrb'),activeLayer=document.getElementById('activeLayer'),activeChar=document.getElementById('activeChar'),cmdWrap=document.getElementById('cmdWrap'),submenu=document.getElementById('submenu'),fx=document.getElementById('fx'),status=document.getElementById('status'),chainFill=document.getElementById('chainFill'),chainText=document.getElementById('chainText'),sparkLayer=document.getElementById('sparkLayer'),stageTitle=document.getElementById('stageTitle');
let last=performance.now(),paused=false,active=null,chain=0,enemyClock=0,stage=0,wave=1;const maxWave=3;let gauge={hero:0,dragon:0};const speed={hero:40,dragon:36};const party={hero:{hp:130,max:130},dragon:{hp:155,max:155}};
const stages=[{bg:'corridor_broken.jpg',title:'ALIEN SHIP · DAMAGED CORRIDOR'},{bg:'bridge_broken.jpg',title:'ALIEN SHIP · DAMAGED BRIDGE'}];
let enemies=[];function resetEnemies(){ const packs={1:[72,92,72],2:[78,102,78],3:[86,118,86]}; const imgs={1:['enemy_rifle.png','enemy_mage.png','enemy_rifle.png'],2:['enemy_rifle.png','enemy_mage.png','enemy_rifle.png'],3:['enemy_rifle_damaged.png','enemy_mage_damaged.png','enemy_rifle_damaged.png']}; enemies=[0,1,2].map((_,i)=>({hp:packs[wave][i],max:packs[wave][i],img:imgs[wave][i],dead:false})); renderEnemies(); status.innerHTML=`WAVE <b>${wave}</b> / ${maxWave} · 게이지가 가득 차면 캐릭터를 누르세요.`; }
function renderEnemies(){enemyRow.innerHTML='';enemies.forEach((e,i)=>{const d=document.createElement('div');d.className='enemy'+(e.dead?' dead':'');d.dataset.i=i;d.innerHTML=`<img src="${A+e.img}"><div class="hp"><i style="width:${100*e.hp/e.max}%"></i></div>`;enemyRow.appendChild(d);});}
function setBg(){game.style.backgroundImage=`url('${A+stages[stage].bg}')`;stageTitle.textContent=stages[stage].title+` · WAVE ${wave}/${maxWave}`;}
setBg();resetEnemies();
function updateOrb(el,p){el.style.setProperty('--p',p.toFixed(1));el.classList.toggle('ready',p>=100&&!paused);}function addChain(n){chain=Math.min(100,chain+n);chainFill.style.width=chain+'%';chainText.textContent=chain>=100?'⚡ 연계기 READY':'연계 게이지 '+Math.round(chain)+'%';chainText.className=chain>=100?'chainReady':'';}
function spark(){const s=document.createElement('i');s.className='spark';s.style.left=(8+Math.random()*84)+'%';s.style.top=(8+Math.random()*65)+'%';sparkLayer.appendChild(s);setTimeout(()=>s.remove(),800)}setInterval(()=>{if(Math.random()<.7)spark()},480);
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;if(!paused){for(const k of ['hero','dragon'])gauge[k]=Math.min(100,gauge[k]+speed[k]*dt);enemyClock+=dt;if(enemyClock>2.15){enemyClock=0;enemyAttack();}}updateOrb(heroOrb,gauge.hero);updateOrb(dragonOrb,gauge.dragon);requestAnimationFrame(loop)}requestAnimationFrame(loop);
heroOrb.onclick=()=>openTurn('hero');dragonOrb.onclick=()=>openTurn('dragon');function openTurn(k){if(paused||gauge[k]<100)return;paused=true;active=k;status.textContent=(k==='hero'?'카엘':'실리트라')+'의 턴';activeLayer.classList.add('show');activeChar.src=A+(k==='hero'?'hero.png':'dragon_human.png');activeChar.className='activeChar focusIn '+(k==='hero'?'heroFocus':'dragonFocus');cmdWrap.className='cmdWrap '+(k==='hero'?'right':'left');cmdWrap.style.setProperty('--sx',k==='hero'?'25px':'-25px');const mid=k==='hero'?'스킬':'마법';cmdWrap.innerHTML=`<button class="cmd" data-menu="attack">공격</button><button class="cmd" data-menu="special">${mid}</button><button class="cmd" data-menu="item">도구</button>`;submenu.innerHTML='';cmdWrap.querySelectorAll('button').forEach(b=>b.onclick=()=>showSub(b.dataset.menu));}
function showSub(type){let arr=[];if(type==='attack')arr=active==='hero'?[['쇄광참','빠른 횡베기','slash',44],['승천파','강한 올려치기','up',64]]:[['용아참','빠른 참격','redslash',46],['홍련절','강한 회전베기','spin',66]];if(type==='special'&&active==='hero')arr=[['회천섬','원형 검기 · 광역','spin',54],['파갑성','방어 파쇄','slash',50]];if(type==='special'&&active==='dragon')arr=[['홍련폭염','화염 폭발 · 광역','fire',60],['뇌광창','집중 마법','lightning',72],['백룡결계','연계 게이지 보너스','guard',0]];if(type==='item')arr=[['회복약','HP 회복','heal',0],['마력폭탄','적 전체 공격','fire',48]];submenu.innerHTML=arr.map((x,i)=>`<button data-i="${i}">${x[0]}<small>${x[1]}</small></button>`).join('')+'<button class="back">←</button>';submenu.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>execute(arr[+b.dataset.i]));submenu.querySelector('.back').onclick=()=>submenu.innerHTML='';}
function targetIndex(){let live=enemies.map((e,i)=>!e.dead?i:-1).filter(i=>i>=0);return live[Math.floor(Math.random()*live.length)]??-1}function hitEnemy(i,d){if(i<0)return;const e=enemies[i];e.hp=Math.max(0,e.hp-d);if(e.hp===0)e.dead=true;const node=enemyRow.children[i];node.classList.add('hit');node.querySelector('.hp i').style.width=(100*e.hp/e.max)+'%';setTimeout(()=>node.classList.remove('hit'),300);if(e.dead)setTimeout(()=>node.classList.add('dead'),140);damageText(d,'#dff9ff');shake();if(enemies.every(x=>x.dead))setTimeout(()=>{ if(wave<maxWave) nextWave(); else nextStage(); },700)}
function execute(a){const [name,desc,kind,dmg]=a;cmdWrap.innerHTML='';submenu.innerHTML='';status.textContent=name;const who=active;const frames=who==='hero'?'hero_atk_':'dragon_atk_';const f=kind==='spin'?3:kind==='up'?1:2;const im=document.createElement('img');im.className='attackActor';im.src=A+frames+f+'.png';im.style.left='50%';fx.appendChild(im);setTimeout(()=>im.remove(),900);setTimeout(()=>{if(kind==='heal'){party[who].hp=Math.min(party[who].max,party[who].hp+42);damageText('+42','#8fff9e')}else if(kind==='guard'){addChain(28);ringFx('#fff4c4')}else if(kind==='fire'){ringFx('#ff7a49');burst();for(let i=0;i<enemies.length;i++)if(!enemies[i].dead)hitEnemy(i,dmg)}else if(kind==='lightning'){ringFx('#a78cff');let i=targetIndex();hitEnemy(i,dmg+8)}else if(kind==='spin'){slashFx(who==='dragon');for(let i=0;i<enemies.length;i++)if(!enemies[i].dead)hitEnemy(i,dmg)}else{slashFx(who==='dragon');hitEnemy(targetIndex(),dmg)}addChain(kind==='heal'?7:12);},240);setTimeout(closeTurn,930)}
function closeTurn(){gauge[active]=0;active=null;paused=false;activeLayer.classList.remove('show');activeChar.className='activeChar';cmdWrap.innerHTML='';submenu.innerHTML='';status.innerHTML=`WAVE <b>${wave}</b> / ${maxWave} · 게이지가 가득 차면 캐릭터를 누르세요.`;}
function enemyAttack(){let live=enemies.map((e,i)=>!e.dead?i:-1).filter(i=>i>=0);if(!live.length)return;let i=live[Math.floor(Math.random()*live.length)],node=enemyRow.children[i],e=enemies[i];node.classList.add('attack');setTimeout(()=>node.classList.remove('attack'),500);const cut=document.createElement('img');cut.className='enemyCutin';cut.src=A+e.img;fx.appendChild(cut);ringFx(i===1?'#b58cff':'#7bd5ff');setTimeout(()=>burst(),180);setTimeout(()=>cut.remove(),760);const who=Math.random()<.5?'hero':'dragon';const dmg=15+Math.floor(Math.random()*10);party[who].hp=Math.max(1,party[who].hp-dmg);addChain(20);setTimeout(()=>{damageText('-'+dmg,'#ff6b7a');shake();},220);}
function slashFx(red=false){const n=document.createElement('i');n.className='slash'+(red?' redslash':'');fx.appendChild(n);setTimeout(()=>n.remove(),520)}function ringFx(c){const n=document.createElement('i');n.className='ringFx';n.style.borderColor=c;n.style.boxShadow=`0 0 30px ${c},inset 0 0 28px ${c}`;fx.appendChild(n);setTimeout(()=>n.remove(),760)}function burst(){const n=document.createElement('i');n.className='burst';fx.appendChild(n);setTimeout(()=>n.remove(),520)}function damageText(v,c){const n=document.createElement('b');n.className='dmg';n.style.color=c;n.textContent=v;fx.appendChild(n);setTimeout(()=>n.remove(),850)}function shake(){game.classList.remove('shake');void game.offsetWidth;game.classList.add('shake');setTimeout(()=>game.classList.remove('shake'),340)}
function nextWave(){ wave++; stage=wave>=3?1:0; setBg(); resetEnemies(); addChain(8); burst(); ringFx('#9eeeff'); }
function nextStage(){status.innerHTML='<b>SHIP CLEAR</b> · 함선 내부 제압 완료';paused=true;setTimeout(()=>{try{parent.postMessage({type:'dragon-sky-turn-clear'},'*')}catch(e){}},1100)}
})();
</script></body></html>
